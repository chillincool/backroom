name: CI

# Every job runs the same `mise` tasks you can run locally:
#   mise run ci           fmt, clippy, unit tests
#   mise run e2e          end-to-end tests against soju, Keycloak and ergo in Docker
#   mise run apple:core   Rust library + Swift bindings (macOS)
#   mise run apple:app    macOS app build and unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run ci

  e2e:
    needs: checks
    # Linux runners have Docker; macOS runners don't.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Prints the service logs itself if anything fails.
      - run: mise run e2e

  macos:
    needs: checks
    # Apple Silicon; also covers the aarch64 build the owner's Intel Mac can't run.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Rust library + Swift bindings, then the app's build and unit tests
      # (signed ad hoc: Signing.local.xcconfig only exists on dev machines).
      - run: mise run apple:core
      - run: mise run apple:app
