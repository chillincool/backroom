# Tools and tasks for working on Backroom. CI runs the same tasks, so
# `mise run ci` and `mise run e2e` locally do exactly what GitHub Actions does.
#   mise install        install the pinned tools
#   mise tasks          list tasks

[tools]
rust = { version = "1.100.0", components = "clippy,rustfmt" }
"aqua:EmbarkStudios/cargo-deny" = "0.22.0"
# Generates apple/Backroom.xcodeproj from apple/project.yml; macOS only.
xcodegen = { version = "2.48.0", os = ["macos"] }

[tasks.fmt]
description = "Fail if any Rust file needs rustfmt"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Clippy, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Unit tests (no network, no Docker)"
run = "cargo test --workspace --locked"

[tasks.deny]
description = "cargo-deny: vulnerable or unmaintained crates, licences, sources (deny.toml)"
run = "cargo deny check"

[tasks.ci]
description = "Everything CI checks except e2e"
depends = ["fmt", "clippy", "test", "deny"]

[tasks.e2e]
description = "End-to-end tests against soju, Keycloak and ergo in Docker (start, test, stop)"
run = "scripts/e2e.sh all"

[tasks."e2e:up"]
description = "Start the e2e stack and keep it running"
run = "scripts/e2e.sh up"

[tasks."e2e:test"]
description = "Rerun the e2e tests on the running stack"
run = "scripts/e2e.sh test"

[tasks."e2e:down"]
description = "Stop the e2e stack and delete its data"
run = "scripts/e2e.sh down"

[tasks."e2e:realm"]
description = "Regenerate test/e2e/keycloak/realm.json from build-realm.sh (slow)"
run = "scripts/e2e.sh realm"

[tasks."apple:core"]
description = "Build backroom-ffi and regenerate apple/BackroomCore (needs Xcode)"
run = "scripts/build-apple.sh"

[tasks."apple:project"]
description = "Generate apple/Backroom.xcodeproj from apple/project.yml"
run = "xcodegen generate --spec apple/project.yml --quiet"

[tasks."apple:app"]
description = "Build the macOS app and run its tests (after apple:core)"
depends = ["apple:project"]
run = "xcodebuild -project apple/Backroom.xcodeproj -scheme Backroom -destination 'platform=macOS' -derivedDataPath apple/build -quiet test"

[tasks."linux:run"]
description = "Run the Linux app (GTK) from source; BACKROOM_LOG=debug for logs"
run = "cargo run --locked -p backroom-gtk"

[tasks."linux:install"]
description = "Build the Linux app and install it for this user (menu entry, login callback); --remove to uninstall"
run = "scripts/linux-install.sh"

[tasks."linux:flatpak"]
description = "Build the Flatpak and install it for this user (needs flatpak-builder)"
run = "scripts/flatpak.sh"

[tasks."linux:deb"]
description = "Build a .deb of the Linux app (target/debian/)"
run = [
  "cargo build --locked --release -p backroom-gtk",
  "mise x cargo:cargo-deb@3.8.0 -- cargo deb --locked --no-build -p backroom-gtk",
]

[tasks."linux:rpm"]
description = "Build an .rpm of the Linux app (target/generate-rpm/)"
run = [
  "cargo build --locked --release -p backroom-gtk",
  "mise x cargo:cargo-generate-rpm@0.21.1 -- cargo generate-rpm -p crates/backroom-gtk",
]
