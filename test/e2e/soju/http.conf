# auth http: soju POSTs the credentials as HTTP Basic auth to the stub
# (200 = valid, 403 = invalid) and creates the user on first login.
db sqlite3 /data/main.db
message-store db
listen ws+insecure://0.0.0.0:8080
listen irc+insecure://0.0.0.0:6667
listen ircs://0.0.0.0:6697
listen unix+admin:///run/soju/admin
tls /certs/soju.crt /certs/soju.key
hostname soju.e2e
enable-user-on-auth true
auth http http://httpauth:8080/
