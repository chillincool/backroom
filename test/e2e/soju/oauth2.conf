# auth oauth2 against the e2e Keycloak, like production. soju introspects
# tokens as the confidential client `soju` over the compose network.
db sqlite3 /data/main.db
message-store db
listen ws+insecure://0.0.0.0:8080
listen irc+insecure://0.0.0.0:6667
listen ircs://0.0.0.0:6697
listen unix+admin:///run/soju/admin
tls /certs/soju.crt /certs/soju.key
hostname soju.e2e
enable-user-on-auth true
auth oauth2 http://soju:soju-e2e-secret@keycloak:8080/realms/e2e
