[workspace]
resolver = "3"
members = [
  "crates/backroom-core",
  "crates/backroom-cli",
  "crates/backroom-ffi",
  "crates/backroom-app",
  "crates/backroom-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[workspace.dependencies]
backroom-core = { path = "crates/backroom-core" }
backroom-ffi = { path = "crates/backroom-ffi" }
backroom-app = { path = "crates/backroom-app" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
httparse = "1"
# Web links in message text (backroom-app).
linkify = "0.12"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
open = "5"
# Link previews. Same major as oauth2 uses; rustls (ring) like everything else.
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls"] }
rpassword = "7"
# Standalone mode's local history; SQLite compiled in, no system library.
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Link previews: OpenGraph tags from a page's <head>.
scraper = { version = "0.29", default-features = false }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uniffi = "0.33.0"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
zeroize = "1"

# Linux app (backroom-gtk). Baseline: GTK 4.14 and libadwaita 1.5 (GNOME
# 46: Ubuntu 24.04, Debian 13, Fedora 40+, RHEL 10); the Flatpak brings newer.
gtk = { package = "gtk4", version = "0.11", features = ["gnome_46"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
# Secret Service (GNOME Keyring, KWallet, KeePassXC) or, in a Flatpak, the
# Secret portal. RustCrypto, not OpenSSL.
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }

[workspace.lints.rust]
unsafe_code = "forbid"
